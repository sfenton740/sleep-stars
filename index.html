<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2b1d6b">
<title>Sleep Stars ⭐ Carter &amp; Harper</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<style>
:root{--night:#2b1d6b;--night2:#4a2fa0;--gold:#ffd23f;--pink:#ff8ac4;--blue:#4cc9f0;--green:#52d17c;--red:#ff5d73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Comic Sans MS","Chalkboard SE","Baloo 2","Trebuchet MS",system-ui,sans-serif;color:#fff;
 background:radial-gradient(circle at 20% 10%,#5b3fc4 0,transparent 40%),linear-gradient(180deg,var(--night),#160e3d);background-attachment:fixed;overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.2}}
header{position:relative;z-index:1;text-align:center;padding:14px 10px 0}
h1{margin:0;font-size:clamp(28px,7vw,52px);letter-spacing:1px;text-shadow:0 4px 0 #1a0f45}
h1 .moon{display:inline-block;animation:bob 3s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-6px) rotate(-8deg)}}
.goal{font-size:clamp(16px,3.6vw,22px);margin:6px 0 0;opacity:.95}
.top-btns{position:fixed;top:10px;right:10px;z-index:5;display:flex;gap:8px}
.icon-btn{border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;width:46px;height:46px;border-radius:50%;cursor:pointer}
.icon-btn.prize{background:var(--pink);font-size:24px}
main{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;padding:16px;max-width:1100px;margin:0 auto}
.kid{border-radius:32px;padding:18px 16px 22px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25);position:relative}
.kid.carter{background:linear-gradient(160deg,#3a86ff,#1d4fb8)}
.kid.harper{background:linear-gradient(160deg,#ff6fb5,#c2338a)}
.kid h2{margin:4px 0 0;font-size:clamp(34px,8vw,48px);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.avatar{width:150px;height:150px;display:block;margin:0 auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.avatar.happy{animation:jump .6s 2}
@keyframes jump{50%{transform:translateY(-20px) scale(1.05)}}
.stars{display:flex;justify-content:center;gap:4px;margin:14px 0 6px;flex-wrap:nowrap}
.star{width:13%;max-width:58px;aspect-ratio:1;transition:transform .3s}
.star path{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.55);stroke-width:3;stroke-dasharray:6 4}
.star.on path{fill:var(--gold);stroke:#fff;stroke-dasharray:none}
.star.on{animation:pop .5s}
.star.miss path{fill:rgba(255,93,115,.35)}
@keyframes pop{0%{transform:scale(.3) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.count{font-size:clamp(22px,5vw,30px);font-weight:bold;margin:4px 0 12px}
.count b{font-size:1.5em;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.3)}
.big{display:block;width:100%;border:0;border-radius:28px;padding:22px 10px;font:inherit;font-size:clamp(24px,6vw,34px);font-weight:bold;
 color:#2b1d6b;background:var(--gold);box-shadow:0 8px 0 #c79a00;cursor:pointer;transition:transform .1s}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #c79a00}
.big.done{background:var(--green);box-shadow:0 8px 0 #2e9150;color:#fff}
.big .e{font-size:1.3em;vertical-align:middle}
.sub{margin-top:10px;font-size:18px;min-height:24px;opacity:.95}
.week{display:flex;justify-content:center;gap:6px;margin-top:12px;font-size:13px;opacity:.9}
.week span{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.15);border-radius:12px;padding:4px 6px;min-width:36px}
.week em{font-style:normal;font-size:20px}
.gear{position:fixed;bottom:10px;right:10px;z-index:5;opacity:.45}
/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(15,8,45,.85);display:none;align-items:center;justify-content:center;padding:14px;overflow:auto}
.overlay.show{display:flex}
.card{background:#fff;color:#2b1d6b;border-radius:30px;max-width:640px;width:100%;padding:22px;text-align:center;max-height:94vh;overflow:auto;box-shadow:0 12px 0 rgba(0,0,0,.3)}
.card h2{margin:0 0 8px;font-size:clamp(26px,6vw,40px)}
.card.reward{background:radial-gradient(circle at 50% 20%,#fff0f8,#ffc2e2 70%);border:6px solid var(--pink)}
.puff{width:200px;height:200px;animation:float 2.4s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}
.reward .msg{font-size:clamp(20px,5vw,28px);font-weight:bold;margin:6px 0}
.btn{border:0;border-radius:18px;padding:14px 18px;font:inherit;font-size:18px;font-weight:bold;cursor:pointer;margin:4px;color:#fff;background:var(--night2);box-shadow:0 5px 0 #24156b}
.btn.pink{background:#e8479a;box-shadow:0 5px 0 #a3226a}
.btn.green{background:#2fae5b;box-shadow:0 5px 0 #1d7a3e}
.btn.red{background:#e23c55;box-shadow:0 5px 0 #9c1f33}
.btn.ghost{background:#eee;color:#2b1d6b;box-shadow:0 5px 0 #bbb}
.games{list-style:none;padding:0;margin:12px 0;text-align:left;display:grid;gap:10px}
.games li{background:#fff;border:3px solid #ffc2e2;border-radius:18px;padding:10px 12px}
.games .t{font-weight:bold;font-size:18px}
.tag{display:inline-block;font-size:12px;font-weight:bold;border-radius:10px;padding:2px 8px;margin:3px 4px 0 0;background:#eee;color:#333}
.tag.e{background:#c7f5d4;color:#155c2b}.tag.e10{background:#ffe3a3;color:#6b4a00}.tag.co{background:#cfe9ff;color:#0b4a80}.tag.p{background:#efe0ff;color:#4b2390}
.games .b{font-size:15px;margin-top:4px}
.small{font-size:13px;opacity:.8}
.gal{position:relative;margin:-2px -4px 8px;border-radius:14px;overflow:hidden;background:#2b1d6b}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/9;position:relative}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;top:8px;background:rgba(232,71,154,.92);color:#fff;font-size:12px;font-weight:bold;border-radius:10px;padding:2px 8px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#c2185b;font-size:30px;line-height:40px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.nav.prev{left:6px}.nav.next{right:6px}
.credit{font-size:11px;opacity:.7;margin-top:6px}
.pin{font-size:30px;width:170px;text-align:center;border:3px solid #ccc;border-radius:14px;padding:8px;letter-spacing:8px;font-family:inherit}
.ptable{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
.ptable td{padding:6px 4px;border-bottom:1px solid #eee}
.ptable select{font:inherit;font-size:15px;padding:4px;border-radius:8px}
.tabs{display:flex;justify-content:center;gap:6px;margin:6px 0}
.tabs button.on{background:#e8479a}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="top-btns"><button class="icon-btn" id="muteBtn" title="Sound on/off" aria-label="Sound on/off">🔊</button><button class="icon-btn prize" id="prizeBtn" title="Prizes" aria-label="Prizes">🎁</button></div>
<header>
 <h1><span class="moon">🌙</span> Sleep Stars <span class="moon">⭐</span></h1>
 <p class="goal">7 nights in my bed = a <b style="color:#ffb3d9">Kirby game!</b> 🎮</p>
</header>
<main id="kids"></main>
<button class="icon-btn gear" id="gearBtn" title="Grown-ups" aria-label="Parent settings">⚙️</button>

<!-- reward -->
<div class="overlay" id="rewardOv"><div class="card reward">
 <svg class="puff" viewBox="0 0 200 200" aria-hidden="true">
  <g fill="#ffd23f"><path d="M30 30l5 12 13 1-10 8 3 13-11-7-11 7 3-13-10-8 13-1z"/><path d="M165 25l4 9 10 1-8 6 3 10-9-5-9 5 3-10-8-6 10-1z"/><path d="M170 140l4 9 10 1-8 6 3 10-9-5-9 5 3-10-8-6 10-1z"/></g>
  <ellipse cx="62" cy="170" rx="34" ry="16" fill="#e8304f"/><ellipse cx="140" cy="170" rx="34" ry="16" fill="#e8304f"/>
  <ellipse cx="38" cy="100" rx="20" ry="16" fill="#ff9ccc"/><ellipse cx="164" cy="88" rx="20" ry="16" fill="#ff9ccc" transform="rotate(-30 164 88)"/>
  <circle cx="100" cy="105" r="66" fill="#ffb3d9"/>
  <ellipse cx="82" cy="92" rx="9" ry="20" fill="#1b1464"/><ellipse cx="118" cy="92" rx="9" ry="20" fill="#1b1464"/>
  <ellipse cx="82" cy="84" rx="5" ry="8" fill="#fff"/><ellipse cx="118" cy="84" rx="5" ry="8" fill="#fff"/>
  <ellipse cx="82" cy="104" rx="5" ry="5" fill="#3a7bff"/><ellipse cx="118" cy="104" rx="5" ry="5" fill="#3a7bff"/>
  <ellipse cx="62" cy="118" rx="10" ry="6" fill="#ff6fa8"/><ellipse cx="138" cy="118" rx="10" ry="6" fill="#ff6fa8"/>
  <path d="M90 122 q10 14 20 0 z" fill="#c2185b"/>
 </svg>
 <h2 id="rewardTitle">7 STARS!</h2>
 <p class="msg">🌟 You slept in your bed 7 nights in a row! 🌟</p>
 <p class="msg" style="color:#c2185b">You earned a KIRBY game on Switch! 🎮💖</p>
 <p>Pick your prize with a grown-up:</p>
 <div id="rewardGames"></div>
 <button class="btn pink" onclick="closeOv('rewardOv')">Yay! 🎉</button>
</div></div>

<!-- prizes -->
<div class="overlay" id="prizeOv"><div class="card reward">
 <h2>🎁 Kirby Prizes</h2>
 <p>Get 7 ⭐ in a row and pick one!</p>
 <div id="prizeGames"></div>
 <button class="btn pink" onclick="closeOv('prizeOv')">Close</button>
</div></div>

<!-- parent -->
<div class="overlay" id="parentOv"><div class="card" id="parentCard"></div></div>

<canvas id="confetti"></canvas>

<script>
const KIDS=[{id:"carter",name:"Carter",age:6},{id:"harper",name:"Harper",age:4}];
const GOAL=7, PIN="1234", KEY="sleepStars.v1";
const GAMES=[
 {m:"buffet",v:1,t:"Kirby's Dream Buffet",p:"Switch",r:"E",co:"Up to 4 players",b:"Roll around as a tiny strawberry-cake Kirby and gobble yummy treats in races and party games. Short, silly and super easy!"},
 {m:"fighters2",t:"Kirby Fighters 2",p:"Switch",r:"E",co:"Up to 4 players (team up with a buddy in Story)",b:"Bonk-and-bounce battles with lots of Kirbys wearing funny hats. Team up with your brother or sister!"},
 {m:"forgotten",v:1,t:"Kirby and the Forgotten Land",p:"Switch",r:"E10+",co:"2-player co-op",b:"Kirby's big 3D adventure! Mouthful Mode lets Kirby gobble up a car or a vending machine. Player 2 is Bandana Waddle Dee."},
 {m:"forgotten-s2",v:1,t:"Kirby and the Forgotten Land – Nintendo Switch 2 Edition + Star-Crossed World",p:"Switch 2",r:"E10+",co:"2-player co-op",b:"The same big adventure, extra shiny on Switch 2, plus a bonus Star-Crossed World with new levels."},
 {m:"dreamland",v:1,t:"Kirby's Return to Dream Land Deluxe",p:"Switch",r:"E10+",co:"Up to 4 players",b:"Hop through colorful side-scrolling levels to help a friend fix his spaceship. Very easy to play together!"},
 {m:"starallies",v:1,t:"Kirby Star Allies",p:"Switch",r:"E10+",co:"Up to 4 players",b:"Throw hearts to make friends and go on a team adventure. Lots of drop-in, drop-out co-op fun."},
 {m:"airriders",v:1,t:"Kirby Air Riders",p:"Switch 2",r:"E10+",co:"Multiplayer (local & online)",b:"Zoom on star-shaped racing machines! Fast racing and battle events with Kirby and friends."}
];
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
// "last night" = yesterday's date (kids tap in the morning)
function lastNightKey(){const d=new Date(); d.setDate(d.getDate()-1); return dkey(d);}
function addDays(k,n){const [y,m,d]=k.split("-").map(Number);const x=new Date(y,m-1,d);x.setDate(x.getDate()+n);return dkey(x);}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
let S=load(); KIDS.forEach(k=>{S[k.id]=S[k.id]||{nights:{},history:[],celebrated:{}}});
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
// one-time seed: both kids already slept in bed Sun Oct 18 & Mon Oct 19, 2026
const SEED_VERSION=1, SEED_NIGHTS=["2026-10-18","2026-10-19"];
if((S.seedVersion||0)<SEED_VERSION){KIDS.forEach(k=>SEED_NIGHTS.forEach(d=>{if(S[k.id].nights[d]===undefined)S[k.id].nights[d]=true}));S.seedVersion=SEED_VERSION;save();}
function setNight(id,k,v,label){const n=S[id].nights;S[id].history.push({k,prev:n[k]===undefined?null:n[k]});
 if(v===null)delete n[k];else n[k]=v; S[id].history=S[id].history.slice(-50); save();}
// streak: consecutive "yes" nights ending at last night (or tonight-in-progress if last night unmarked yet)
function streak(id){const n=S[id].nights;let k=lastNightKey(),c=0;
 if(n[k]===undefined)k=addDays(k,-1); // last night not tapped yet: don't break streak until it's marked a miss
 while(n[k]===true){c++;k=addDays(k,-1);} return c;}
function render(){
 const main=document.getElementById("kids");main.innerHTML="";
 KIDS.forEach(kid=>{
  const s=streak(kid.id), shown=Math.min(s,GOAL), ln=lastNightKey(), st=S[kid.id].nights[ln];
  const el=document.createElement("section");el.className="kid "+kid.id;
  let stars="";for(let i=0;i<GOAL;i++)stars+=`<svg class="star ${i<shown?"on":""}" viewBox="0 0 100 100"><path d="M50 6l13 28 30 3-23 20 7 30-27-16-27 16 7-30-23-20 30-3z" stroke-linejoin="round"/></svg>`;
  let week="";for(let i=6;i>=0;i--){const k=addDays(ln,-i);const v=S[kid.id].nights[k];
   const dn=new Date(k+"T12:00").toLocaleDateString(undefined,{weekday:"short"});
   week+=`<span><em>${v===true?"⭐":v===false?"🌧️":"·"}</em>${dn}</span>`;}
  const btn= st===true?`<button class="big done" disabled><span class="e">✅</span> Got my star!</button>`
     :`<button class="big" data-kid="${kid.id}"><span class="e">🛏️</span> I slept in my bed! <span class="e">⭐</span></button>`;
  const sub= st===true?(s>=GOAL?"🏆 Kirby time! Tap 🎁":"See you tonight! 🌙 "+(GOAL-s)+" more to go!")
     : st===false? "Last night was a 🌧️. New start tonight — you can do it! 💪" : "Did you sleep in your bed last night?";
  el.innerHTML=`${avatar(kid.id)}<h2>${kid.name}</h2><div class="stars">${stars}</div>
   <div class="count"><b>${s}</b> / ${GOAL} nights ${s>=GOAL?"🎉":""}</div>${btn}<div class="sub">${sub}</div><div class="week">${week}</div>`;
  main.appendChild(el);
 });
 main.querySelectorAll(".big[data-kid]").forEach(b=>b.onclick=()=>tap(b.dataset.kid));
}
function tap(id){const k=lastNightKey(); if(S[id].nights[k]===true)return; // no double counting
 unlockAudio(); setNight(id,k,true); render();
 const av=document.querySelector("."+id+" .avatar"); if(av)av.classList.add("happy");
 const s=streak(id); burst(40); if(s>=GOAL && !S[id].celebrated[k])bigSong(); else starSong();
 if(s>=GOAL && !S[id].celebrated[k]){S[id].celebrated[k]=true;save();setTimeout(()=>celebrate(id),600);}
}
function celebrate(id){const kid=KIDS.find(k=>k.id===id);
 document.getElementById("rewardTitle").textContent="⭐ 7 STARS, "+kid.name.toUpperCase()+"! ⭐";
 document.getElementById("rewardGames").innerHTML=gamesHTML(); openOv("rewardOv"); confettiRain(4500);}
function gamesHTML(){return `<ul class="games">${GAMES.map(g=>`<li>${gallery(g)}<div class="t">${g.t}</div>
 <span class="tag p">${g.p}</span><span class="tag ${g.r==="E"?"e":"e10"}">ESRB ${g.r}</span><span class="tag co">👫 ${g.co}</span>
 <div class="b">${g.b}</div></li>`).join("")}</ul>
 <p class="small">For grown-ups: ESRB ratings checked Oct 2026. "E" = Everyone; "E10+" = recommended 10+ for cartoon/fantasy action (Kirby-style bonking, no gore) — parent's call for ages 4 & 6. Switch 2 titles need a Nintendo Switch 2. Some games offer optional in-game purchases.</p><p class="credit">Screenshots &amp; clips: official Nintendo media from nintendo.com store pages. Kirby &amp; Nintendo Switch are trademarks of Nintendo; this is a family page, not affiliated with Nintendo.</p>`}
function gallery(g){const b="assets/"+g.m+"/";let items="";
 if(g.v)items+=`<div class="slide"><video src="${b}clip.mp4" poster="${b}poster.webp" muted loop playsinline autoplay preload="none" disablepictureinpicture onerror="this.parentNode.remove()"></video><span class="badge">▶ gameplay</span></div>`;
 for(let i=1;i<=3;i++)items+=`<div class="slide"><img src="${b}shot${i}.webp" loading="lazy" decoding="async" alt="${g.t} screenshot ${i}" onerror="this.parentNode.remove()"></div>`;
 return `<div class="gal"><div class="track">${items}</div><button class="nav prev" aria-label="Previous picture" onclick="galMove(this,-1)">‹</button><button class="nav next" aria-label="Next picture" onclick="galMove(this,1)">›</button></div>`}
function galMove(btn,d){const t=btn.parentNode.querySelector(".track");t.scrollBy({left:d*t.clientWidth,behavior:"smooth"})}
function openOv(id){document.getElementById(id).classList.add("show")}
function closeOv(id){const o=document.getElementById(id);o.classList.remove("show");o.querySelectorAll("video").forEach(v=>v.pause());if(id!=="parentOv"){const c=o.querySelector("[id$=Games]");if(c)c.innerHTML=""}}
document.getElementById("prizeBtn").onclick=()=>{document.getElementById("prizeGames").innerHTML=gamesHTML();openOv("prizeOv")};

// ---------- avatars (cartoon, not real people) ----------
function avatar(id){
 if(id==="carter")return `<svg class="avatar" viewBox="0 0 160 160" role="img" aria-label="Cartoon Carter">
 <circle cx="80" cy="80" r="76" fill="#bde0ff"/>
 <path d="M30 160c4-34 24-48 50-48s46 14 50 48z" fill="#ff8c1a"/><path d="M62 118l18 16 18-16" fill="none" stroke="#fff" stroke-width="5"/>
 <circle cx="80" cy="74" r="40" fill="#f6c9a0"/>
 <path d="M40 70c0-28 18-40 40-40s42 12 40 40c-6-12-14-18-22-18-4 8-16 10-30 6-10-3-20 2-28 12z" fill="#7a4a21"/>
 <path d="M70 34l6-10 6 10 6-8 2 12z" fill="#7a4a21"/>
 <circle cx="40" cy="78" r="7" fill="#f6c9a0"/><circle cx="120" cy="78" r="7" fill="#f6c9a0"/>
 <ellipse cx="66" cy="76" rx="5" ry="7" fill="#2b1d6b"/><ellipse cx="94" cy="76" rx="5" ry="7" fill="#2b1d6b"/>
 <circle cx="68" cy="73" r="2" fill="#fff"/><circle cx="96" cy="73" r="2" fill="#fff"/>
 <circle cx="58" cy="90" r="6" fill="#ff9e9e" opacity=".7"/><circle cx="102" cy="90" r="6" fill="#ff9e9e" opacity=".7"/>
 <path d="M66 94q14 14 28 0" fill="none" stroke="#8a3b2a" stroke-width="4" stroke-linecap="round"/>
 <text x="80" y="152" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">CARTER</text></svg>`;
 return `<svg class="avatar" viewBox="0 0 160 160" role="img" aria-label="Cartoon Harper">
 <circle cx="80" cy="80" r="76" fill="#ffd6ec"/>
 <circle cx="34" cy="62" r="16" fill="#e0a530"/><circle cx="126" cy="62" r="16" fill="#e0a530"/>
 <path d="M30 160c4-34 24-48 50-48s46 14 50 48z" fill="#9b5de5"/><circle cx="80" cy="132" r="5" fill="#ffd23f"/>
 <circle cx="80" cy="76" r="40" fill="#f2c4a0"/>
 <path d="M40 74c-2-30 18-42 40-42s44 12 40 42c-8-14-24-20-40-22-14 2-30 8-40 22z" fill="#e0a530"/>
 <circle cx="124" cy="46" r="8" fill="#ff4fa3"/><path d="M112 40l12 6-12 6zM136 40l-12 6 12 6z" fill="#ff4fa3"/>
 <ellipse cx="66" cy="78" rx="5" ry="7" fill="#2b1d6b"/><ellipse cx="94" cy="78" rx="5" ry="7" fill="#2b1d6b"/>
 <circle cx="68" cy="75" r="2" fill="#fff"/><circle cx="96" cy="75" r="2" fill="#fff"/>
 <path d="M61 74l-5-3M99 74l5-3" stroke="#2b1d6b" stroke-width="2.5" stroke-linecap="round"/>
 <circle cx="58" cy="92" r="6" fill="#ff8fb8" opacity=".75"/><circle cx="102" cy="92" r="6" fill="#ff8fb8" opacity=".75"/>
 <path d="M68 96q12 12 24 0" fill="none" stroke="#a33a52" stroke-width="4" stroke-linecap="round"/>
 <text x="80" y="152" font-size="16" text-anchor="middle" fill="#fff" font-weight="bold">HARPER</text></svg>`;
}

// ---------- sounds: ORIGINAL chiptune jingles (composed for this page; not Nintendo music) ----------
const MUTE_KEY="sleepStars.muted";let muted=localStorage.getItem(MUTE_KEY)==="1";
const muteBtn=document.getElementById("muteBtn");
function paintMute(){muteBtn.textContent=muted?"🔇":"🔊"}paintMute();
muteBtn.onclick=()=>{muted=!muted;localStorage.setItem(MUTE_KEY,muted?"1":"0");paintMute();if(muted)stopSong();else{unlockAudio();blip()}};
let AC,song=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume();
 const b=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=b;src.connect(AC.destination);src.start(0);}catch(e){}}
["touchstart","pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,unlockAudio,{once:true,passive:true}));
const mf=m=>440*Math.pow(2,(m-69)/12);
const N={C3:48,D3:50,E3:52,F3:53,G3:55,A3:57,B3:59,C4:60,D4:62,E4:64,F4:65,G4:67,A4:69,B4:71,C5:72,D5:74,E5:76,F5:77,G5:79,A5:81,B5:83,C6:84,D6:86,E6:88,F6:89,G6:91,A6:93,C7:96};
function stopSong(){if(song){const t=AC.currentTime;song.gain.cancelScheduledValues(t);song.gain.setValueAtTime(song.gain.value,t);song.gain.linearRampToValueAtTime(0,t+.08);const g=song;setTimeout(()=>g.disconnect(),200);song=null}}
function voice(out,type,f,t,d,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.setValueAtTime(v,t+d*.6);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(out);o.start(t);o.stop(t+d+.02)}
function hat(out,t,v){const len=AC.sampleRate*.04,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
 const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type="highpass";f.frequency.value=7000;g.gain.value=v;s.connect(f).connect(g).connect(out);s.start(t)}
// play(score): lead/bass/arp are arrays of [note,startBeat,lengthBeats]
function play(sc){if(muted)return;try{unlockAudio();stopSong();const out=AC.createGain();out.gain.value=.9;out.connect(AC.destination);song=out;
 const b=60/sc.bpm,t0=AC.currentTime+.05;
 sc.lead.forEach(([n,s,l])=>voice(out,"square",mf(N[n]),t0+s*b,l*b*.95,.07));
 sc.bass.forEach(([n,s,l])=>voice(out,"triangle",mf(N[n]),t0+s*b,l*b*.9,.22));
 (sc.arp||[]).forEach(([n,s,l])=>voice(out,"triangle",mf(N[n]),t0+s*b,l*b,.045));
 for(let i=0;i<sc.beats*2;i++)hat(out,t0+i*b/2,i%2?.05:.025);
 setTimeout(()=>{if(song===out)song=null},(sc.beats*b+1)*1000)}catch(e){}}
// helpers to build bars
function arpBar(chord,bar){const r=[];for(let i=0;i<16;i++)r.push([chord[i%chord.length],bar*4+i*.25,.2]);return r}
function bounceBass(root,fifth,bar){return[[root,bar*4,.9],[fifth,bar*4+1,.9],[root,bar*4+2,.9],[fifth,bar*4+3,.9]]}
const CH={C:["C6","E6","G6","E6"],F:["C6","F6","A6","F6"],G:["B5","D6","G6","D6"],Am:["C6","E6","A6","E6"],Dm:["D6","F6","A6","F6"]};
// Star jingle (~6 s, 160 bpm, C major): original bouncy tune
const STAR_SONG={bpm:160,beats:16,
 lead:[["G4",0,.5],["C5",.5,.5],["E5",1,.5],["G5",1.5,1],["E5",2.5,.5],["F5",3,.5],["G5",3.5,.5],
  ["A5",4,.75],["G5",4.75,.25],["F5",5,.5],["A5",5.5,.5],["C6",6,1],["A5",7,.5],["G5",7.5,.5],
  ["B4",8,.5],["D5",8.5,.5],["G5",9,.5],["B5",9.5,.5],["A5",10,.5],["G5",10.5,.5],["F5",11,.5],["D5",11.5,.5],
  ["E5",12,.5],["G5",12.5,.5],["C6",13,1],["E6",14,.5],["G6",14.5,1.5]],
 bass:[...bounceBass("C3","G3",0),...bounceBass("F3","C4",1),...bounceBass("G3","D4",2),["C3",12,.9],["G3",13,.9],["C4",14,2]],
 arp:[...arpBar(CH.C,0),...arpBar(CH.F,1),...arpBar(CH.G,2),...arpBar(CH.C,3)]};
// Grand 7-night victory song (~12 s): intro run, two phrases, big finish
const BIG_SONG=(()=>{const L=[],B=[],A=[];const add=(arr,list,off)=>list.forEach(([n,s,l])=>arr.push([n,s+off,l]));
 add(L,[["C5",0,.25],["D5",.25,.25],["E5",.5,.25],["G5",.75,.25],["C6",1,.5],["G5",1.5,.5],["C6",2,.5],["E6",2.5,.5],["G6",3,1]],0);
 add(B,[["C3",0,1],["G3",1,1],["C4",2,1],["G3",3,1]],0);A.push(...arpBar(CH.C,0));
 add(L,STAR_SONG.lead.slice(0,-2),4);add(B,STAR_SONG.bass.slice(0,12),4);A.push(...arpBar(CH.C,1),...arpBar(CH.F,2),...arpBar(CH.G,3));
 add(L,[["E5",12,.5],["G5",12.5,.5],["C6",13,.5],["E6",13.5,.5],["D6",14,.5],["C6",14.5,.5],["A5",15,1],
  ["F5",16,.5],["A5",16.5,.5],["C6",17,.5],["F6",17.5,.5],["E6",18,.5],["D6",18.5,.5],["C6",19,.5],["D6",19.5,.5],
  ["G5",20,.5],["B5",20.5,.5],["D6",21,.5],["G6",21.5,.5],["F6",22,.25],["E6",22.25,.25],["D6",22.5,.25],["B5",22.75,.25],["C6",23,.5],["D6",23.5,.5],
  ["E6",24,.5],["G6",24.5,.5],["C7",25,3]],0);
 add(B,[...bounceBass("A3","E3",3),...bounceBass("F3","C4",4),...bounceBass("G3","D4",5),["C3",24,.9],["G3",25,.9],["C4",26,2]],0);
 A.push(...arpBar(CH.Am,3),...arpBar(CH.F,4),...arpBar(CH.G,5),...arpBar(CH.C,6));
 // final chord
 ["C5","E5","G5"].forEach(n=>L.push([n,25,3]));
 return{bpm:150,beats:28,lead:L,bass:B,arp:A}})();
function starSong(){play(STAR_SONG)}function bigSong(){play(BIG_SONG)}
function blip(){play({bpm:200,beats:1,lead:[["C6",0,.25],["G6",.25,.5]],bass:[]})}
// ---------- confetti ----------
const cv=document.getElementById("confetti"),cx=cv.getContext("2d");let parts=[],raf=null,rainUntil=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}addEventListener("resize",size);size();
const COLS=["#ffd23f","#ff8ac4","#4cc9f0","#52d17c","#ff5d73","#fff"];
function spawn(x,y,vy){parts.push({x,y,vx:(Math.random()-.5)*8,vy,r:Math.random()*6+4,c:COLS[Math.random()*COLS.length|0],a:Math.random()*6,s:Math.random()<.4,life:200})}
function burst(n){for(let i=0;i<n;i++)spawn(innerWidth/2,innerHeight*.6,-Math.random()*14-4);loop()}
function confettiRain(ms){rainUntil=Date.now()+ms;loop()}
function star(x,y,r){cx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r/2:r;cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}cx.fill()}
function loop(){if(raf)return;const step=()=>{cx.clearRect(0,0,cv.width,cv.height);
 if(Date.now()<rainUntil)for(let i=0;i<5;i++)spawn(Math.random()*innerWidth,-10,Math.random()*2+1);
 parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.a+=.1;p.life--;cx.fillStyle=p.c;
  if(p.s)star(p.x,p.y,p.r*1.4);else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}});
 parts=parts.filter(p=>p.life>0&&p.y<cv.height+20);
 if(parts.length||Date.now()<rainUntil)raf=requestAnimationFrame(step);else{raf=null;cx.clearRect(0,0,cv.width,cv.height)}};raf=requestAnimationFrame(step)}

// ---------- parent mode ----------
let pKid="carter";
document.getElementById("gearBtn").onclick=()=>{const c=document.getElementById("parentCard");
 c.innerHTML=`<h2>🔒 Grown-ups only</h2><p>Enter PIN</p><input id="pinIn" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><br><br>
 <button class="btn" id="pinOk">Open</button> <button class="btn ghost" onclick="closeOv('parentOv')">Cancel</button><p id="pinErr" style="color:#e23c55"></p>`;
 openOv("parentOv");const i=document.getElementById("pinIn");i.focus();
 const go=()=>{if(i.value===PIN)parentPanel();else{document.getElementById("pinErr").textContent="Oops, try again";i.value=""}};
 document.getElementById("pinOk").onclick=go;i.onkeyup=e=>{if(e.key==="Enter"||i.value.length===4)go()}};
function parentPanel(){const c=document.getElementById("parentCard"),n=S[pKid].nights,ln=lastNightKey();
 let rows="";for(let i=0;i<14;i++){const k=addDays(ln,-i),v=n[k];
  const lbl=new Date(k+"T12:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  rows+=`<tr><td style="text-align:left">${i===0?"<b>Last night</b> ":""}${lbl}</td><td><select data-k="${k}">
  <option value="" ${v===undefined?"selected":""}>— not marked</option><option value="y" ${v===true?"selected":""}>⭐ In own bed</option><option value="n" ${v===false?"selected":""}>🌧️ Miss</option></select></td></tr>`}
 c.innerHTML=`<h2>⚙️ Parent mode</h2>
 <div class="tabs">${KIDS.map(k=>`<button class="btn ${k.id===pKid?"on":""}" data-t="${k.id}">${k.name}</button>`).join("")}</div>
 <p><b>${KIDS.find(k=>k.id===pKid).name}</b>: current streak <b>${streak(pKid)}</b> / ${GOAL}</p>
 <table class="ptable">${rows}</table>
 <button class="btn red" id="missBtn">🌧️ Mark last night a miss</button>
 <button class="btn" id="undoBtn" ${S[pKid].history.length?"":"disabled"}>↩️ Undo last change</button>
 <button class="btn red" id="resetBtn">🔄 Reset ${KIDS.find(k=>k.id===pKid).name}</button>
 <button class="btn pink" id="testBtn">🎉 Preview reward</button><br>
 <button class="btn ghost" onclick="closeOv('parentOv');render()">Done</button>
 <p class="small">Data is saved only on this device/browser.</p>`;
 c.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{pKid=b.dataset.t;parentPanel()});
 c.querySelectorAll("select").forEach(s=>s.onchange=()=>{setNight(pKid,s.dataset.k,s.value==="y"?true:s.value==="n"?false:null);parentPanel();render()});
 document.getElementById("missBtn").onclick=()=>{setNight(pKid,ln,false);parentPanel();render()};
 document.getElementById("undoBtn").onclick=()=>{const h=S[pKid].history.pop();if(h){if(h.prev===null)delete S[pKid].nights[h.k];else S[pKid].nights[h.k]=h.prev;save()}parentPanel();render()};
 document.getElementById("resetBtn").onclick=()=>{if(confirm("Reset all nights for "+pKid+"?")){S[pKid]={nights:{},history:[],celebrated:{}};save();parentPanel();render()}};
 document.getElementById("testBtn").onclick=()=>{closeOv("parentOv");unlockAudio();bigSong();celebrate(pKid)};
}
// background stars
const sky=document.getElementById("sky");for(let i=0;i<60;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=Math.random()*3+"s";sky.appendChild(s)}
render();
</script>
